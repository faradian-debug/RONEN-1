<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יומן מטופלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: practice-management app shell — dark top bar with section tabs, KPI cards, an always-open entry panel, then the register. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #f7f9fa;
  --ink: #16242b;
  --muted: #5f6f74;
  --line: #e2e7ea;
  --line-strong: #cfd7db;
  --bar: #0e3b3a;
  --bar-ink: #e6f2f0;
  --bar-muted: #93b5b1;
  --primary: #0f6b5f;
  --primary-hover: #0c5a50;
  --primary-ink: #ffffff;
  --primary-soft: #e3f2ef;
  --ok: #18794e;
  --ok-soft: #e3f4ea;
  --warn: #9a5b00;
  --warn-soft: #fdf0d9;
  --bad: #c0392b;
  --bad-soft: #fbe6e3;
  --shadow: 0 1px 2px rgba(16, 36, 43, .06), 0 1px 1px rgba(16, 36, 43, .03);
  --shadow-lg: 0 20px 50px rgba(16, 36, 43, .22);
  --radius: 12px;
  --f: "Heebo", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1517; --surface: #141f22; --surface-2: #19262a; --ink: #e4ecee; --muted: #93a6ab; --line: #24343a; --line-strong: #31454c;
    --bar: #0a2524; --bar-ink: #e0eeec; --bar-muted: #7fa39f;
    --primary: #2fa592; --primary-hover: #3bb8a3; --primary-ink: #04201c; --primary-soft: #133430;
    --ok: #5cc98f; --ok-soft: #14301f; --warn: #e6ad4f; --warn-soft: #3a2b12; --bad: #f08a7e; --bad-soft: #3c1f1c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 20px 50px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1517; --surface: #141f22; --surface-2: #19262a; --ink: #e4ecee; --muted: #93a6ab; --line: #24343a; --line-strong: #31454c;
  --bar: #0a2524; --bar-ink: #e0eeec; --bar-muted: #7fa39f;
  --primary: #2fa592; --primary-hover: #3bb8a3; --primary-ink: #04201c; --primary-soft: #133430;
  --ok: #5cc98f; --ok-soft: #14301f; --warn: #e6ad4f; --warn-soft: #3a2b12; --bad: #f08a7e; --bad-soft: #3c1f1c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --shadow-lg: 0 20px 50px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.num, td.n { font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.container { max-width: 1280px; margin: 0 auto; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: .9rem; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover:not(:disabled) { border-color: var(--muted); background: var(--surface-2); }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: .82rem; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line); }
.linkish { background: none; border: 0; padding: 0; font-weight: 600; text-align: start; color: var(--ink); }
.linkish:hover { color: var(--primary); text-decoration: underline; }

/* login */
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 40px; background: radial-gradient(1200px 600px at 80% -10%, var(--primary-soft), transparent 60%), var(--bg); }
.login-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 36px 32px; display: grid; gap: 18px; text-align: center; justify-items: center; }
.mark { width: 56px; height: 56px; border-radius: 14px; background: var(--bar); color: var(--bar-ink); display: grid; place-items: center; font-weight: 800; font-size: 1.6rem; }
.login-card h1 { font-size: 1.6rem; }
.login-card p { margin: 0; color: var(--muted); }
.gbtn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 1rem; }
.gbtn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
.gbtn svg { width: 20px; height: 20px; flex: none; }
.login-note { font-size: .82rem; color: var(--muted); }
.login-err { color: var(--bad); font-weight: 600; font-size: .9rem; }

/* top bar */
.topbar { background: var(--bar); color: var(--bar-ink); position: sticky; top: 0; z-index: 10; padding-top: env(safe-area-inset-top, 0px); }
.topbar .container { display: flex; align-items: center; gap: 24px; min-height: 60px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
.brand .mark { width: 32px; height: 32px; font-size: 1rem; border-radius: 8px; background: var(--primary); color: #fff; }
.nav { display: flex; gap: 4px; align-self: stretch; }
.nav button { background: none; border: 0; color: var(--bar-muted); font-weight: 600; padding: 0 14px; border-bottom: 3px solid transparent; border-top: 3px solid transparent; }
.nav button:hover { color: var(--bar-ink); }
.nav button[aria-selected="true"] { color: var(--bar-ink); border-bottom-color: var(--primary); }
.user { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; font-size: .88rem; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.user .name { color: var(--bar-ink); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user .btn { background: transparent; color: var(--bar-ink); border-color: rgba(255, 255, 255, .25); }
.user .btn:hover { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .45); }

/* page */
main.container { display: grid; gap: 20px; padding-block: 24px 64px; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.page-head h1 { font-size: 1.6rem; }
.page-head p { margin: 2px 0 0; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 4px; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 4px; background: var(--kc, var(--line-strong)); }
.kpi .k { font-size: .82rem; color: var(--muted); font-weight: 500; }
.kpi .v { font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .s { font-size: .8rem; color: var(--muted); }
.kpi.income { --kc: var(--ok); } .kpi.income .v { color: var(--ok); }
.kpi.debt { --kc: var(--bad); } .kpi.debt .v { color: var(--bad); }
.kpi.month { --kc: var(--primary); }
.kpi.invoice { --kc: var(--warn); } .kpi.invoice .v { color: var(--warn); }

.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 1.05rem; }
.card-head .sub { color: var(--muted); font-size: .85rem; font-weight: 400; margin-inline-start: 8px; }

/* entry panel */
.entry { padding: 16px 18px 18px; display: grid; grid-template-columns: 2fr 1.2fr 1fr 1.6fr 1fr 1.2fr; gap: 12px 14px; align-items: end; }
.entry .notes-f { grid-column: 1 / span 5; }
.entry .submit-f { grid-column: 6; }
.entry .submit-f .btn { width: 100%; padding-block: 10px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 11px; min-width: 0; transition: border-color .12s, box-shadow .12s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.field textarea { min-height: 72px; resize: vertical; }
.field .hint { font-size: .78rem; color: var(--primary); min-height: 1em; }
.entry-msg { grid-column: 1 / -1; }
.warnbox { display: flex; gap: 8px; align-items: flex-start; background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); border-radius: 8px; padding: 10px 12px; font-size: .9rem; font-weight: 600; }
.warnbox::before { content: "!"; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--bad); color: var(--surface); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.field .invalid, .field .invalid:focus { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }

/* toolbar + table */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius) var(--radius) 0 0; }
.toolbar input, .toolbar select { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; min-width: 0; font-size: .9rem; }
.toolbar input[type="search"] { width: 220px; }
.toolbar .spacer { flex: 1; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { padding: 11px 14px; text-align: start; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: .78rem; color: var(--muted); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
td.n, th.n { text-align: end; }
tbody tr { transition: background .1s; }
tbody tr:hover td { background: var(--surface-2); }
tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
td.notes { white-space: normal; min-width: 160px; max-width: 280px; color: var(--muted); font-size: .85rem; }
.muted { color: var(--muted); }
.code { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.none { background: var(--surface-2); color: var(--muted); }
.bal-pos { color: var(--bad); font-weight: 700; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--ink); font-size: 1.05rem; }
.meter { height: 8px; width: 160px; background: var(--surface-2); border-radius: 4px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.meter .a { background: var(--ok); }
.meter .b { background: var(--warn); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); padding: 12px 18px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 6px; vertical-align: -1px; background: var(--c, transparent); }

/* side sheet */
.overlay { position: fixed; inset: 0; background: rgba(8, 20, 22, .45); display: flex; justify-content: flex-start; z-index: 20; }
.sheet { background: var(--surface); width: min(460px, 100%); height: 100%; overflow-y: auto; box-shadow: var(--shadow-lg); padding: calc(22px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) 22px max(22px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; align-content: start; }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.sheet header h2 { font-size: 1.2rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--bad); font-size: .88rem; font-weight: 600; }
.sheet footer { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 6px; }
.sheet .preview { border: 1px solid var(--line); border-radius: 8px; }
.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 11px 20px; border-radius: 10px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--shadow-lg); }

@media (max-width: 1000px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .entry { grid-template-columns: repeat(3, 1fr); }
  .entry .notes-f { grid-column: 1 / span 2; }
  .entry .submit-f { grid-column: 3; }
}
@media (max-width: 640px) {
  .topbar .container { gap: 8px 16px; padding-block: 8px 0; }
  .nav { order: 3; width: 100%; overflow-x: auto; }
  .nav button { padding: 10px 12px; }
  .user .name { display: none; }
  .kpi .v { font-size: 1.4rem; }
  .entry { grid-template-columns: 1fr 1fr; }
  .entry .client-f, .entry .notes-f, .entry .submit-f { grid-column: 1 / -1; }
  .toolbar input[type="search"] { width: 100%; }
  .toolbar > * { flex: 1 1 140px; }
  .toolbar .spacer { display: none; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(-24px); opacity: .6; } } }
</style>
</head>
<body>

<!-- Signed-out screen -->
<section class="login gutter" id="login" hidden>
  <div class="login-card">
    <div class="mark" aria-hidden="true">י</div>
    <div>
      <h1>יומן מטופלים</h1>
      <p>ניהול טיפולים, תשלומים וחובות</p>
    </div>
    <button class="gbtn" id="btn-signin" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>כניסה עם חשבון Google</span>
    </button>
    <div class="login-err" id="login-err" hidden></div>
    <div class="login-note">הנתונים נשמרים בחשבון שלך ונגישים רק לך.</div>
  </div>
</section>

<!-- App -->
<div id="app" hidden>
  <header class="topbar gutter">
    <div class="container">
      <div class="brand"><span class="mark" aria-hidden="true">י</span><span>יומן מטופלים</span></div>
      <nav class="nav" role="tablist">
        <button role="tab" id="tab-treatments" data-view="treatments" type="button">טיפולים</button>
        <button role="tab" id="tab-clients" data-view="clients" type="button">מטופלים</button>
        <button role="tab" id="tab-months" data-view="months" type="button">סיכום חודשי</button>
      </nav>
      <div class="user" id="who" hidden>
        <span class="avatar" id="who-avatar"></span>
        <span class="name" id="who-name"></span>
        <button class="btn small" id="btn-signout" type="button">יציאה</button>
      </div>
    </div>
  </header>

  <main class="container gutter">
    <div id="banners"></div>
    <section class="kpis" id="stats" aria-label="סיכום"></section>

    <!-- Treatments -->
    <section id="view-treatments" class="view">
      <div style="display:grid;gap:20px">
        <form class="card" id="entry" novalidate autocomplete="off">
          <div class="card-head"><h2>רישום טיפול חדש</h2><span class="muted" style="font-size:.85rem">מטופל חדש נוצר אוטומטית לפי השם</span></div>
          <div class="entry">
            <div class="field client-f"><label for="q-client">שם מטופל</label><input id="q-client" list="clients-dl" placeholder="הקלידו או בחרו מהרשימה" required><span class="hint" id="q-client-hint"></span></div>
            <div class="field"><label for="q-date">תאריך טיפול</label><input id="q-date" type="date" required><span class="hint"></span></div>
            <div class="field"><label for="q-cost">עלות (₪)</label><input id="q-cost" type="number" inputmode="decimal" min="0" step="1" placeholder="0"><span class="hint"></span></div>
            <div class="field"><label for="q-method">אמצעי תשלום</label><select id="q-method"></select><span class="hint"></span></div>
            <div class="field"><label for="q-paid">סכום ששולם (₪)</label><input id="q-paid" type="number" inputmode="decimal" min="0" step="1" placeholder="0"><span class="hint"></span></div>
            <div class="field"><label for="q-paydate">תאריך תשלום</label><input id="q-paydate" type="date"><span class="hint"></span></div>
            <div class="field notes-f"><label for="q-notes">הערות</label><input id="q-notes" placeholder="לא חובה"></div>
            <div class="field submit-f"><button class="btn primary" type="submit" id="q-submit">הוספה ליומן</button></div>
            <div class="entry-msg" id="q-err" hidden></div>
          </div>
        </form>

        <div class="card">
          <div class="toolbar">
            <input type="search" id="flt-q" placeholder="חיפוש לפי שם או קוד" aria-label="חיפוש">
            <select id="flt-status" aria-label="סטטוס תשלום">
              <option value="">כל הסטטוסים</option>
              <option value="open">חוב פתוח</option>
              <option value="paid">שולם במלואו</option>
              <option value="noinv">שולם ללא חשבונית</option>
            </select>
            <select id="flt-method" aria-label="אמצעי תשלום"><option value="">כל אמצעי התשלום</option></select>
            <input type="month" id="flt-month" aria-label="חודש">
            <button class="btn small ghost" id="flt-clear" type="button">ניקוי סינון</button>
            <span class="spacer"></span>
            <button class="btn small" id="btn-import" type="button">ייבוא CSV</button>
            <button class="btn small" id="btn-export" type="button">ייצוא CSV</button>
          </div>
          <div id="treatments-table"></div>
        </div>
      </div>
    </section>

    <!-- Clients -->
    <section id="view-clients" class="view">
      <div class="card">
        <div class="toolbar">
          <input type="search" id="flt-cq" placeholder="חיפוש מטופל" aria-label="חיפוש מטופל">
          <span class="spacer"></span>
          <button class="btn small primary" id="btn-new-c" type="button">+ מטופל חדש</button>
        </div>
        <div id="clients-table"></div>
      </div>
    </section>

    <!-- Months -->
    <section id="view-months" class="view">
      <div class="card" id="months-card"></div>
    </section>
  </main>
</div>

<input type="file" id="csv-file" accept=".csv,.tsv,.txt,text/csv" hidden>
<div class="overlay" id="overlay" hidden><form class="sheet" id="sheet" novalidate autocomplete="off"></form></div>
<datalist id="clients-dl"></datalist>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const METHODS = ["שולם הוצאה חשבונית", "שולם לא הוצאה חשבונית", "לא שולם"];
const M_INVOICE = METHODS[0], M_NOINV = METHODS[1], M_UNPAID = METHODS[2];

const state = {
  clients: new Map(),
  treatments: new Map(),
  loaded: { clients: false, treatments: false },
  mode: "connecting", // connecting | signedout | live | noconfig | offline
  view: "treatments",
  f: { q: "", status: "", method: "", month: "" },
  cq: "",
};
let fs = null, auth = null, uid = null, unsubs = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nis = new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 });
const money = (n) => nis.format(Math.round(n || 0));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const fmtDate = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const monthName = (ym) => { const [y, m] = ym.split("-"); return new Date(+y, +m - 1, 1).toLocaleDateString("he-IL", { month: "long", year: "numeric" }); };
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), ms);
}

/* ---------- derived data ---------- */
function calc(t) {
  const cost = +t.cost || 0, paid = +t.paid || 0, bal = cost - paid;
  let status = "none";
  if (cost > 0 || paid > 0) status = bal <= 0 ? "paid" : paid > 0 ? "partial" : "unpaid";
  return { cost, paid, bal, status };
}
const clientOf = (t) => state.clients.get(t.clientId) || { name: "(מטופל נמחק)", code: "" };
const sortedTreatments = () => [...state.treatments.values()].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
function nextCode() {
  let max = 100;
  for (const c of state.clients.values()) { const n = parseInt(c.code, 10); if (!isNaN(n) && n > max) max = n; }
  return String(max + 1);
}
const findClientByName = (name) => { const n = name.trim(); for (const c of state.clients.values()) if (c.name.trim() === n) return c; return null; };

/* ---------- persistence ---------- */
// Every user's data lives under users/{uid}/ — see firestore.rules.
async function put(col, id, data) {
  if (fs && uid) { await setDoc(doc(fs, "users", uid, col, id), data); return; }
  if (state.mode === "live" || state.mode === "signedout") throw { code: "not-signed-in" };
  state[col].set(id, { id, ...data }); render();
}
async function remove(col, id) {
  if (fs && uid) { await deleteDoc(doc(fs, "users", uid, col, id)); return; }
  if (state.mode === "live" || state.mode === "signedout") throw { code: "not-signed-in" };
  state[col].delete(id); render();
}
function clean(obj) { const o = { ...obj }; delete o.id; return o; }
function writeError(e) {
  const code = e && e.code;
  if (code === "permission-denied" || code === "not-signed-in") toast("אין הרשאה לשמור. צאו והיכנסו שוב.", 5000);
  else if (code === "resource-exhausted") toast("חרגתם ממכסת השימוש של Firebase. נסו שוב מאוחר יותר.", 5000);
  else toast("השמירה נכשלה. בדקו את החיבור לאינטרנט ונסו שוב.", 4000);
}

function stopListening() {
  unsubs.forEach((u) => u()); unsubs = [];
  state.clients = new Map(); state.treatments = new Map();
  state.loaded = { clients: false, treatments: false };
}

function showUser(user) {
  $("who").hidden = !user;
  if (!user) return;
  const name = user.displayName || user.email || "";
  $("who-name").textContent = name;
  const av = $("who-avatar"); av.textContent = "";
  if (user.photoURL) { const img = document.createElement("img"); img.src = user.photoURL; img.alt = ""; img.referrerPolicy = "no-referrer"; av.appendChild(img); }
  else av.textContent = (name.trim()[0] || "?").toUpperCase();
}

function connect() {
  if (!firebaseConfig || !firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith("PASTE")) { state.mode = "noconfig"; render(); return; }
  try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app); auth.languageCode = "he"; fs = getFirestore(app);
  } catch (e) { console.error(e); state.mode = "offline"; render(); return; }
  getRedirectResult(auth).catch((e) => loginError(e));
  onAuthStateChanged(auth, (user) => {
    stopListening();
    uid = user ? user.uid : null;
    showUser(user);
    if (!user) { state.mode = "signedout"; render(); return; }
    state.mode = "live";
    for (const col of ["clients", "treatments"]) {
      unsubs.push(onSnapshot(collection(fs, "users", uid, col), (snap) => {
        state[col] = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
        state.loaded[col] = true;
        render();
      }, (e) => { console.error(e); toast("לא הצלחתי לטעון את הנתונים מ-Firebase.", 5000); }));
    }
    render();
  });
}

function loginError(e) {
  const code = (e && e.code) || "";
  if (!code || code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") return;
  const msg = code === "auth/unauthorized-domain" ? "הכתובת הזו לא מאושרת לכניסה ב-Firebase."
    : code === "auth/operation-not-allowed" ? "הכניסה עם Google לא הופעלה ב-Firebase."
    : code === "auth/network-request-failed" ? "אין חיבור לאינטרנט."
    : "הכניסה נכשלה (" + code + "). נסו שוב.";
  $("login-err").textContent = msg; $("login-err").hidden = false;
}
async function signIn() {
  $("login-err").hidden = true;
  const btn = $("btn-signin"); btn.disabled = true;
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) { await signInWithRedirect(auth, provider); return; }
    loginError(e);
  } finally { btn.disabled = false; }
}
$("btn-signin").onclick = signIn;
$("btn-signout").onclick = () => signOut(auth);

/* ---------- rendering ---------- */
function render() {
  const signedOut = state.mode === "signedout";
  $("login").hidden = !signedOut;
  $("app").hidden = signedOut || state.mode === "connecting";
  if (signedOut || state.mode === "connecting") return;
  renderStats(); renderBanners(); renderTabs(); renderDatalist();
  if (state.view === "treatments") renderTreatments();
  else if (state.view === "clients") renderClients();
  else renderMonths();
}

function renderStats() {
  let income = 0, debt = 0, noinv = 0, noinvSum = 0, monthCount = 0, monthIncome = 0;
  const debtors = new Set(), ym = today().slice(0, 7);
  for (const t of state.treatments.values()) {
    const c = calc(t);
    income += c.paid;
    if (c.bal > 0) { debt += c.bal; debtors.add(t.clientId); }
    if (t.method === M_NOINV && c.paid > 0) { noinv++; noinvSum += c.paid; }
    if ((t.date || "").startsWith(ym)) { monthCount++; monthIncome += c.paid; }
  }
  $("stats").innerHTML = `
    <div class="kpi income"><span class="k">סה"כ הכנסה</span><span class="v">${money(income)}</span><span class="s">${state.treatments.size} טיפולים ביומן</span></div>
    <div class="kpi debt"><span class="k">יתרת חוב פתוחה</span><span class="v">${money(debt)}</span><span class="s">${debtors.size ? debtors.size + " מטופלים חייבים" : "אין חובות פתוחים"}</span></div>
    <div class="kpi month"><span class="k">הכנסה ב${esc(monthName(ym))}</span><span class="v">${money(monthIncome)}</span><span class="s">${monthCount} טיפולים החודש</span></div>
    <div class="kpi invoice"><span class="k">שולם ללא חשבונית</span><span class="v">${noinv}</span><span class="s">${noinv ? money(noinvSum) + " ממתינים לחשבונית" : "כל החשבוניות הוצאו"}</span></div>`;
}

function renderBanners() {
  const parts = [];
  if (state.mode === "offline") parts.push(`<div class="banner"><span>אין חיבור ל-Firebase, לכן השינויים יישמרו רק עד סגירת העמוד.</span></div>`);
  if (state.mode === "noconfig") parts.push(`<div class="banner"><span>התוכנה לא מחוברת ל-Firebase (חסר public/firebase-config.js). השינויים יישמרו רק עד סגירת העמוד.</span></div>`);
  $("banners").innerHTML = parts.join("");
  $("banners").hidden = !parts.length;
}

function renderTabs() {
  document.querySelectorAll(".nav button").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.view === state.view)));
  for (const v of ["treatments", "clients", "months"]) $("view-" + v).hidden = state.view !== v;
}

function renderDatalist() {
  $("clients-dl").innerHTML = [...state.clients.values()].sort((a, b) => a.name.localeCompare(b.name, "he")).map((c) => `<option value="${esc(c.name)}"></option>`).join("");
}

const loading = () => state.mode === "live" && !(state.loaded.clients && state.loaded.treatments);
const loadingHtml = `<div class="empty"><span>טוען את היומן…</span></div>`;

function methodChip(t) {
  if (t.method === M_INVOICE) return `<span class="chip ok">${esc(t.method)}</span>`;
  if (t.method === M_NOINV) return `<span class="chip warn">${esc(t.method)}</span>`;
  if (t.method === M_UNPAID) return `<span class="chip bad">${esc(t.method)}</span>`;
  return t.method ? `<span class="chip none">${esc(t.method)}</span>` : `<span class="muted">לא צוין</span>`;
}

function filteredTreatments() {
  const { q, status, method, month } = state.f, qq = q.trim();
  return sortedTreatments().filter((t) => {
    const cl = clientOf(t), c = calc(t);
    if (qq && !(cl.name.includes(qq) || String(cl.code).includes(qq))) return false;
    if (month && !(t.date || "").startsWith(month)) return false;
    if (method && (t.method || "") !== (method === "_none" ? "" : method)) return false;
    if (status === "open" && !(c.bal > 0)) return false;
    if (status === "paid" && c.status !== "paid") return false;
    if (status === "noinv" && !(t.method === M_NOINV && c.paid > 0)) return false;
    return true;
  });
}

function renderTreatments() {
  const box = $("treatments-table");
  if (loading()) { box.innerHTML = loadingHtml; return; }
  if (!state.treatments.size) {
    box.innerHTML = `<div class="empty"><strong>היומן עדיין ריק</strong><span>רשמו טיפול בטופס שלמעלה, או ייבאו את הגיליון הקיים (בגוגל שיטס: קובץ ← הורדה ← CSV).</span><button class="btn" type="button" data-act="import">ייבוא CSV</button></div>`;
    return;
  }
  const rows = filteredTreatments();
  let tc = 0, tp = 0, tb = 0;
  const body = rows.map((t) => {
    const cl = clientOf(t), c = calc(t); tc += c.cost; tp += c.paid; tb += Math.max(c.bal, 0);
    return `<tr>
      <td><button class="linkish" type="button" data-act="filter-client" data-name="${esc(cl.name)}">${esc(cl.name)}</button></td>
      <td class="code">${esc(cl.code)}</td>
      <td class="num">${fmtDate(t.date)}</td>
      <td class="num">${t.payDate ? fmtDate(t.payDate) : '<span class="muted">—</span>'}</td>
      <td class="n">${money(c.cost)}</td>
      <td class="n">${money(c.paid)}</td>
      <td>${methodChip(t)}</td>
      <td class="n ${c.bal > 0 ? "bal-pos" : ""}">${c.bal > 0 ? money(c.bal) : '<span class="muted">—</span>'}</td>
      <td class="notes">${esc(t.notes || "")}</td>
      <td><button class="btn small" type="button" data-act="edit-t" data-id="${esc(t.id)}">עריכה</button></td>
    </tr>`;
  }).join("");
  box.innerHTML = `<div class="scroll"><table>
    <thead><tr><th>שם מטופל</th><th>קוד</th><th>תאריך טיפול</th><th>תאריך תשלום</th><th class="n">עלות</th><th class="n">סכום ששולם</th><th>אמצעי תשלום</th><th class="n">יתרה</th><th>הערות</th><th></th></tr></thead>
    <tbody>${body || `<tr><td colspan="10" class="muted" style="text-align:center;padding:28px">אין טיפולים שמתאימים לסינון</td></tr>`}</tbody>
    <tfoot><tr><td colspan="4">${rows.length} טיפולים</td><td class="n">${money(tc)}</td><td class="n">${money(tp)}</td><td></td><td class="n">${tb ? money(tb) : "—"}</td><td colspan="2"></td></tr></tfoot>
  </table></div>`;
}

function clientAgg() {
  const agg = new Map();
  for (const c of state.clients.values()) agg.set(c.id, { c, n: 0, cost: 0, paid: 0, bal: 0, last: "" });
  for (const t of state.treatments.values()) {
    const a = agg.get(t.clientId); if (!a) continue;
    const c = calc(t); a.n++; a.cost += c.cost; a.paid += c.paid; a.bal += c.bal;
    if ((t.date || "") > a.last) a.last = t.date;
  }
  return [...agg.values()];
}

function renderClients() {
  const box = $("clients-table");
  if (loading()) { box.innerHTML = loadingHtml; return; }
  if (!state.clients.size) {
    box.innerHTML = `<div class="empty"><strong>אין עדיין מטופלים</strong><span>מטופל נוצר אוטומטית כשרושמים לו טיפול, או אפשר להוסיף אותו כאן.</span><button class="btn primary" type="button" data-act="new-c">+ מטופל חדש</button></div>`;
    return;
  }
  const qq = state.cq.trim();
  const list = clientAgg().filter((a) => !qq || a.c.name.includes(qq) || String(a.c.code).includes(qq))
    .sort((x, y) => (y.bal > 0) - (x.bal > 0) || y.bal - x.bal || x.c.name.localeCompare(y.c.name, "he"));
  let tn = 0, tp = 0, tb = 0;
  const body = list.map((a) => {
    tn += a.n; tp += a.paid; tb += Math.max(a.bal, 0);
    const chip = a.n === 0 ? `<span class="chip none">עוד לא נרשמו טיפולים</span>` : a.bal > 0 ? `<span class="chip bad">חוב ${money(a.bal)}</span>` : a.bal < 0 ? `<span class="chip warn">זכות ${money(-a.bal)}</span>` : `<span class="chip ok">מאוזן</span>`;
    return `<tr>
      <td><button class="linkish" type="button" data-act="open-client" data-name="${esc(a.c.name)}">${esc(a.c.name)}</button></td>
      <td class="code">${esc(a.c.code)}</td>
      <td class="num" dir="ltr" style="text-align:right">${esc(a.c.phone || "")}</td>
      <td class="n">${a.c.price ? money(a.c.price) : '<span class="muted">—</span>'}</td>
      <td class="n">${a.n}</td>
      <td class="num">${a.last ? fmtDate(a.last) : '<span class="muted">—</span>'}</td>
      <td class="n">${money(a.paid)}</td>
      <td>${chip}</td>
      <td><div class="actions"><button class="btn small" type="button" data-act="new-t-for" data-name="${esc(a.c.name)}">+ טיפול</button><button class="btn small" type="button" data-act="edit-c" data-id="${esc(a.c.id)}">עריכה</button></div></td>
    </tr>`;
  }).join("");
  box.innerHTML = `<div class="scroll"><table>
    <thead><tr><th>מטופל</th><th>קוד</th><th>טלפון</th><th class="n">מחיר לטיפול</th><th class="n">טיפולים</th><th>טיפול אחרון</th><th class="n">שולם</th><th>יתרת חוב</th><th></th></tr></thead>
    <tbody>${body || `<tr><td colspan="9" class="muted" style="text-align:center;padding:28px">לא נמצאו מטופלים</td></tr>`}</tbody>
    <tfoot><tr><td colspan="4">${list.length} מטופלים</td><td class="n">${tn}</td><td></td><td class="n">${money(tp)}</td><td>${tb ? money(tb) : "—"}</td><td></td></tr></tfoot>
  </table></div>`;
}

function renderMonths() {
  const box = $("months-card");
  if (loading()) { box.innerHTML = loadingHtml; return; }
  const by = new Map();
  for (const t of state.treatments.values()) {
    const ym = (t.date || "").slice(0, 7) || "????-??";
    const m = by.get(ym) || { n: 0, cost: 0, paid: 0, inv: 0, noinv: 0, bal: 0 };
    const c = calc(t); m.n++; m.cost += c.cost; m.paid += c.paid; m.bal += Math.max(c.bal, 0);
    if (t.method === M_INVOICE) m.inv += c.paid; else if (t.method === M_NOINV) m.noinv += c.paid;
    by.set(ym, m);
  }
  if (!by.size) { box.innerHTML = `<div class="empty"><strong>אין עדיין נתונים לסיכום</strong><span>הסיכום החודשי יתמלא אחרי שתרשמו טיפולים.</span></div>`; return; }
  const months = [...by.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  const maxPaid = Math.max(1, ...months.map(([, m]) => m.paid));
  const tot = { n: 0, cost: 0, paid: 0, inv: 0, noinv: 0, bal: 0 };
  const body = months.map(([ym, m]) => {
    for (const k in tot) tot[k] += m[k];
    const wa = (m.inv / maxPaid) * 100, wb = ((m.paid - m.inv) / maxPaid) * 100;
    return `<tr>
      <td>${ym.includes("?") ? "ללא תאריך" : esc(monthName(ym))}</td>
      <td class="n">${m.n}</td><td class="n">${money(m.cost)}</td><td class="n">${money(m.paid)}</td>
      <td class="n">${money(m.inv)}</td><td class="n">${m.noinv ? money(m.noinv) : "—"}</td>
      <td class="n ${m.bal > 0 ? "bal-pos" : ""}">${m.bal ? money(m.bal) : "—"}</td>
      <td><div class="meter" title="${money(m.paid)}"><i class="a" style="width:${wa}%"></i><i class="b" style="width:${wb}%"></i></div></td>
    </tr>`;
  }).join("");
  box.innerHTML = `<div class="card-head"><h2>סיכום חודשי<span class="sub">לפי תאריך הטיפול</span></h2></div>
  <div class="scroll"><table>
    <thead><tr><th>חודש</th><th class="n">טיפולים</th><th class="n">חיוב</th><th class="n">הכנסה</th><th class="n">עם חשבונית</th><th class="n">ללא חשבונית</th><th class="n">חוב פתוח</th><th>הכנסה</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td>סה"כ</td><td class="n">${tot.n}</td><td class="n">${money(tot.cost)}</td><td class="n">${money(tot.paid)}</td><td class="n">${money(tot.inv)}</td><td class="n">${money(tot.noinv)}</td><td class="n">${money(tot.bal)}</td><td></td></tr></tfoot>
  </table></div>
  <div class="legend"><span style="--c:var(--ok)">הכנסה עם חשבונית</span><span style="--c:var(--warn)">הכנסה אחרת</span></div>`;
}

/* ---------- shared treatment logic (entry panel + edit sheet) ---------- */
const methodOptions = (sel) => {
  const opts = [`<option value="">לא צוין</option>`, ...METHODS.map((m) => `<option ${sel === m ? "selected" : ""}>${esc(m)}</option>`)];
  if (sel && !METHODS.includes(sel)) opts.push(`<option selected>${esc(sel)}</option>`);
  return opts.join("");
};

// p = id prefix ("q" for the entry panel, "f" for the edit sheet)
function wireTreatmentFields(p) {
  const hint = () => {
    const n = $(p + "-client").value.trim(), c = n && findClientByName(n);
    $(p + "-client-hint").textContent = !n ? "" : !c ? `מטופל חדש · יקבל קוד ${nextCode()}` : c.price ? `מחיר קבוע: ${money(c.price)}` : "";
  };
  // Choosing a client always loads their fixed price; a paid amount that mirrored the old cost follows it.
  $(p + "-client").addEventListener("input", () => {
    hint(); const c = findClientByName($(p + "-client").value);
    if (!c || !c.price) return;
    const cost = $(p + "-cost"), paid = $(p + "-paid"), old = cost.value;
    cost.value = c.price;
    if (old !== "" && paid.value === old) paid.value = c.price;
  });
  $(p + "-method").addEventListener("change", () => {
    const m = $(p + "-method").value;
    if (m === M_UNPAID) { $(p + "-paid").value = 0; $(p + "-paydate").value = ""; }
    else if (m && !(+$(p + "-paid").value)) { $(p + "-paid").value = $(p + "-cost").value || ""; if (!$(p + "-paydate").value) $(p + "-paydate").value = today(); }
  });
  hint();
  return hint;
}

// Shows a validation warning in the form and marks the offending field.
function showFormError(errId, x) {
  const err = $(errId);
  document.querySelectorAll(".invalid").forEach((e) => e.classList.remove("invalid"));
  err.textContent = x.user; err.className = (err.className.replace(/\bwarnbox\b/, "") + " warnbox").trim(); err.hidden = false;
  if (x.field) {
    const el = $(x.field); el.classList.add("invalid"); el.focus();
    el.addEventListener("input", () => { el.classList.remove("invalid"); err.hidden = true; }, { once: true });
  }
}

async function saveTreatment(p, existing) {
  const nm = $(p + "-client").value.trim(), date = $(p + "-date").value;
  if (!nm) throw { user: "צריך למלא שם מטופל.", field: p + "-client" };
  if (!date) throw { user: "צריך למלא תאריך טיפול.", field: p + "-date" };
  const paid = +$(p + "-paid").value || 0, method = $(p + "-method").value, payDate = $(p + "-paydate").value;
  if (method === M_UNPAID && paid > 0) throw { user: "נבחר \"לא שולם\" אבל הוזן סכום ששולם. בחרו אמצעי תשלום אחר או אפסו את הסכום ששולם.", field: p + "-method" };
  if ((paid > 0 || (method && method !== M_UNPAID)) && !payDate) throw { user: "חסר תאריך תשלום. אי אפשר לשמור תשלום בלי התאריך שבו התקבל.", field: p + "-paydate" };
  let client = findClientByName(nm);
  if (!client) {
    client = { id: newId(), name: nm, code: nextCode(), phone: "", price: +$(p + "-cost").value || 0, notes: "" };
    await put("clients", client.id, clean(client));
    state.clients.set(client.id, client);
  }
  const data = { clientId: client.id, date, cost: +$(p + "-cost").value || 0, paid: +$(p + "-paid").value || 0, method: $(p + "-method").value, payDate: $(p + "-paydate").value, notes: $(p + "-notes").value.trim() };
  await put("treatments", existing ? existing.id : newId(), data);
}

/* entry panel */
$("q-method").innerHTML = methodOptions("");
$("q-date").value = today();
const entryHint = wireTreatmentFields("q");
$("entry").addEventListener("submit", async (e) => {

});

/* ---------- sheets ---------- */
function openSheet(html, onSubmit, onReady) {
  const s = $("sheet"); s.innerHTML = html; $("overlay").hidden = false;
  s.onsubmit = async (e) => { e.preventDefault(); await onSubmit(); };
  s.querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeSheet));
  onReady && onReady(s);
  const first = s.querySelector("input,select,textarea"); first && first.focus();
}
function closeSheet() { $("overlay").hidden = true; $("sheet").innerHTML = ""; }
$("overlay").addEventListener("mousedown", (e) => { if (e.target === $("overlay")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });

function armDelete(btn, action) {
  btn.onclick = async () => {
    if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "לחיצה נוספת תמחק"; return; }
    btn.disabled = true; await action();
  };
}

    <div class="row2">

    <header><h2>${isNew ? "מטופל חדש" : "עריכת מטופל"}</h2><button class="btn small" type="button" data-close>סגירה</button></header>
    <div class="field"><label for="c-name">שם מטופל</label><input id="c-name" value="${esc(c.name || "")}" required></div>
    <div class="row2">
      <div class="field"><label for="c-code">קוד</label><input id="c-code" value="${esc(c.code || "")}"></div>
      <div class="field"><label for="c-price">מחיר לטיפול (₪)</label><input id="c-price" type="number" inputmode="decimal" min="0" value="${esc(c.price || "")}"></div>
    </div>

    ${!isNew && count ? `<span class="muted" style="font-size:.85rem">למטופל ${count} טיפולים ביומן. כדי למחוק אותו צריך קודם למחוק את הטיפולים שלו.</span>` : ""}
  `, async () => {

  });
}

/* ---------- CSV import / export ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const firstLine = text.split("\n")[0];
  const delim = (firstLine.split("\t").length > firstLine.split(",").length) ? "\t" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ""; }
    else if (ch === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (ch !== "\r") f += ch;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const cellVal = (s) => { s = (s || "").trim(); return /^#(N\/A|REF!|VALUE!|DIV\/0!|NAME\?)/i.test(s) ? "" : s; };
const parseNum = (s) => { const n = parseFloat(cellVal(s).replace(/[^\d.\-]/g, "")); return isNaN(n) ? 0 : n; };
function parseDate(s) {
  s = cellVal(s); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  if ((m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
  return "";
}
function normMethod(s) {
  s = cellVal(s); if (!s) return "";
  if (METHODS.includes(s)) return s;
  if (s.includes("לא שולם")) return M_UNPAID;
  if (s.includes("לא הוצא")) return M_NOINV;
  if (s.includes("שולם")) return M_INVOICE;
  return s;
}

function analyzeImport(rows) {
  const hi = rows.findIndex((r) => r.some((c) => c.includes("שם")));
  if (hi < 0) return { error: "לא מצאתי שורת כותרות עם העמודה \"שם מטופל\"." };
  const h = rows[hi].map((c) => c.trim());
  const idx = (pred) => h.findIndex(pred);
  const col = {
    name: idx((c) => c.includes("שם")),
    code: idx((c) => c.includes("קוד")),
    date: idx((c) => c.includes("תאריך") && c.includes("טיפול")),
    payDate: idx((c) => c.includes("תאריך") && c.includes("תשל")),
    cost: idx((c) => c.includes("עלות")),
    paid: idx((c) => c.includes("סכום") || c.includes("ששולם")),
    method: idx((c) => c.includes("אמצעי")),
  };
  const get = (r, k) => (col[k] >= 0 ? r[col[k]] || "" : "");
  const newClients = new Map(), items = [];
  for (const r of rows.slice(hi + 1)) {
    const name = cellVal(get(r, "name")); if (!name) continue;
    const date = parseDate(get(r, "date")), cost = parseNum(get(r, "cost")), paid = parseNum(get(r, "paid"));
    if (!date && !cost && !paid) continue;
    let client = findClientByName(name) || newClients.get(name);
    if (!client) { client = { id: newId(), name, code: cellVal(get(r, "code")), phone: "", price: cost || 0, notes: "" }; newClients.set(name, client); }
    items.push({ clientId: client.id, date, cost, paid, method: normMethod(get(r, "method")), payDate: parseDate(get(r, "payDate")), notes: "" });
  }
  return { newClients: [...newClients.values()], items };
}

function importFlow(text) {
  const res = analyzeImport(parseCSV(text));
  const body = res.error
    ? `<div class="err">${esc(res.error)}</div><span class="muted">ודאו שהקובץ יוצא מהגיליון עם שורת הכותרות (שם מטופל, קוד, תאריך טיפול, תאריך תשלום, עלות, סכום ששולם, אמצעי תשלום).</span>`
    : `<p style="margin:0">נמצאו <strong>${res.items.length}</strong> טיפולים ו-<strong>${res.newClients.length}</strong> מטופלים חדשים.</p>
       <span class="muted" style="font-size:.85rem">מטופלים שכבר קיימים ביומן יקושרו לפי השם. ייבוא חוזר של אותו קובץ ייצור כפילויות.</span>
       ${res.items.length ? `<div class="scroll preview"><table><thead><tr><th>שם</th><th>תאריך</th><th class="n">עלות</th><th class="n">שולם</th></tr></thead><tbody>${res.items.slice(0, 6).map((it) => {
         const c = state.clients.get(it.clientId) || res.newClients.find((x) => x.id === it.clientId);
         return `<tr><td>${esc(c.name)}</td><td class="num">${fmtDate(it.date)}</td><td class="n">${money(it.cost)}</td><td class="n">${money(it.paid)}</td></tr>`; }).join("")}</tbody></table></div>` : ""}
       <div class="muted" id="imp-progress"></div>`;
  openSheet(`<header><h2>ייבוא מהגיליון</h2><button class="btn small" type="button" data-close>סגירה</button></header>${body}
    <footer>${!res.error && res.items.length ? `<button class="btn primary" type="submit" id="imp-go">ייבוא ${res.items.length} טיפולים</button>` : ""}<button class="btn" type="button" data-close>ביטול</button></footer>`,
    async () => {
      if (res.error || !res.items.length) return;
      const go = $("imp-go"); go.disabled = true;
      const used = new Set([...state.clients.values()].map((c) => String(c.code)));
      let next = parseInt(nextCode(), 10);
      try {
        for (const c of res.newClients) {
          if (!c.code || used.has(String(c.code))) { while (used.has(String(next))) next++; c.code = String(next); }
          used.add(String(c.code));
          await put("clients", c.id, clean(c)); state.clients.set(c.id, c);
        }
        let i = 0;
        for (const it of res.items) { await put("treatments", newId(), it); i++; if (i % 5 === 0) $("imp-progress").textContent = `נשמרו ${i} מתוך ${res.items.length}…`; }
        closeSheet(); toast(`יובאו ${res.items.length} טיפולים`);
      } catch (e) { writeError(e); go.disabled = false; }
    });
}

$("btn-import").onclick = () => $("csv-file").click();
$("csv-file").addEventListener("change", () => {
  const file = $("csv-file").files[0]; if (!file) return;
  const r = new FileReader(); r.onload = () => { importFlow(String(r.result)); $("csv-file").value = ""; }; r.readAsText(file, "utf-8");
});

$("btn-export").onclick = () => {
  const q = (v) => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const lines = [["שם מטופל", "קוד", "תאריך טיפול", "תאריך תשלום", "עלות", "סכום ששולם", "אמצעי תשלום", "יתרה", "הערות"].join(",")];
  for (const t of sortedTreatments().reverse()) {
    const cl = clientOf(t), c = calc(t);
    lines.push([cl.name, cl.code, fmtDate(t.date), fmtDate(t.payDate), c.cost, c.paid, t.method, c.bal, t.notes].map(q).join(","));
  }
  const url = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = `yoman-metuplim-${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
};

/* ---------- events ---------- */
document.querySelectorAll(".nav button").forEach((t) => (t.onclick = () => { state.view = t.dataset.view; try { localStorage.setItem("view", state.view); } catch {} render(); }));
$("btn-new-c").onclick = () => clientSheet(null);
$("flt-method").innerHTML += METHODS.map((m) => `<option>${esc(m)}</option>`).join("") + `<option value="_none">לא צוין</option>`;
for (const [id, key] of [["flt-q", "q"], ["flt-status", "status"], ["flt-method", "method"], ["flt-month", "month"]])
  $(id).addEventListener("input", () => { state.f[key] = $(id).value; render(); });
$("flt-cq").addEventListener("input", () => { state.cq = $("flt-cq").value; render(); });
$("flt-clear").onclick = () => { state.f = { q: "", status: "", method: "", month: "" }; ["flt-q", "flt-status", "flt-method", "flt-month"].forEach((id) => ($(id).value = "")); render(); };

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "edit-t") treatmentSheet(state.treatments.get(b.dataset.id));
  else if (act === "edit-c") clientSheet(state.clients.get(b.dataset.id));
  else if (act === "new-c") clientSheet(null);
  else if (act === "import") $("csv-file").click();
  else if (act === "new-t-for") {
    state.view = "treatments"; render();
    $("q-client").value = b.dataset.name; $("q-client").dispatchEvent(new Event("input"));
    $("entry").scrollIntoView({ behavior: "smooth", block: "start" }); $("q-date").focus();
  }
  else if (act === "filter-client" || act === "open-client") {
    state.f.q = b.dataset.name; $("flt-q").value = b.dataset.name; state.view = "treatments"; render();
  }
});

try { const v = localStorage.getItem("view"); if (["treatments", "clients", "months"].includes(v)) state.view = v; } catch {}
render();
connect();
